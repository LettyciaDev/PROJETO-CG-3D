<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cubo Mágico 3D - Three.js</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: #111;
        font-family: sans-serif;
      }
      #canvas-container {
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div id="canvas-container"></div>
    <style>
      #ui-container {
        position: absolute;
        top: 20px;
        left: 20px;
        z-index: 10;
        color: white;
      }

      #stats {
        margin-bottom: 15px;
        font-size: 18px;
      }

      #controls-panel {
        display: flex;
        gap: 8px;
      }

      #controls-panel button {
        padding: 12px 18px;
        cursor: pointer;
        border: none;
        border-radius: 5px;
        font-size: 16px;
      }
    </style>
    <!-- Adicionado ao index.html -->
    <div id="ui-container">
      <div id="stats">Movimentos: <span id="move-count">0</span></div>
      <div id="controls-panel">
        <button onclick="makeMove('U')">U</button>
        <button onclick="makeMove('D')">D</button>
        <button onclick="makeMove('L')">L</button>
        <button onclick="makeMove('R')">R</button>
        <button onclick="makeMove('F')">F</button>
        <button onclick="makeMove('B')">B</button>
      </div>
    </div>

    <!-- Three.js e OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="app.js"></script>
  </body>
</html>
